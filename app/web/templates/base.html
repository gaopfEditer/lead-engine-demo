<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contractor Lead Engine{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { margin: 0; background: #f6f7fb; }
    nav { background: #0f2d52; color: #fff; padding: .75rem 1.25rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    nav a { color: #dbeafe; text-decoration: none; }
    nav a.active { color: #fff; font-weight: 600; }
    main { max-width: 1100px; margin: 1rem auto; padding: 0 1rem 2rem; }
    .card { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: .45rem .35rem; border-bottom: 1px solid #e5e7eb; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: 999px; font-size: .75rem; background: #e5e7eb; }
    .Hot { background: #fee2e2; color: #991b1b; }
    .Warm { background: #fef3c7; color: #92400e; }
    .Cold { background: #e0e7ff; color: #3730a3; }
    .muted { color: #6b7280; font-size: .85rem; }
    .banner { background: #fff7ed; border: 1px solid #fdba74; padding: .6rem .8rem; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav>
    <strong>Contractor Lead Engine</strong>
    <a href="/">Pipeline</a>
    <a href="/leads">Leads</a>
    <a href="/icp">ICP</a>
    <a href="/quality">Data Quality</a>
    <a href="/sync">Sync Log</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
